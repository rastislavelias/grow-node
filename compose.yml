services:
  postgres:
    image: postgres:17-alpine
    container_name: grow-node-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: grow_node
      POSTGRES_PASSWORD: grow_node
      POSTGRES_DB: grow_node
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grow_node -d grow_node']
      interval: 2s
      timeout: 5s
      retries: 15

  db-setup:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: grow-node-db-setup
    restart: 'no'
    command: >-
      sh -c "pnpm --filter @grow-node/db exec prisma migrate deploy &&
      pnpm --filter @grow-node/db db:seed"
    environment:
      CI: 'true'
      DATABASE_URL: postgresql://grow_node:grow_node@postgres:5432/grow_node
    depends_on:
      postgres:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: grow-node-mosquitto
    restart: unless-stopped
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: grow-node-api
    restart: unless-stopped
    command: sh -c "pnpm --filter @grow-node/contracts build && pnpm --filter @grow-node/api dev"
    environment:
      CI: 'true'
      DATABASE_URL: postgresql://grow_node:grow_node@postgres:5432/grow_node
      MQTT_URL: mqtt://mosquitto:1883
      CONTROL_HEALTH_URL: http://control:4100/health
      HEARTBEAT_STALE_MS: 30000
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DASHBOARD_ORIGIN: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      db-setup:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started

  control:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: grow-node-control
    restart: unless-stopped
    command: sh -c "pnpm --filter @grow-node/contracts build && pnpm --filter @grow-node/control dev"
    environment:
      CI: 'true'
      DATABASE_URL: postgresql://grow_node:grow_node@postgres:5432/grow_node
      MQTT_URL: mqtt://mosquitto:1883
      CONTROL_HOST: 0.0.0.0
      CONTROL_PORT: 4100
    depends_on:
      db-setup:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: grow-node-simulator
    restart: unless-stopped
    command: sh -c "pnpm --filter @grow-node/contracts build && pnpm --filter @grow-node/simulator dev"
    environment:
      CI: 'true'
      MQTT_URL: mqtt://mosquitto:1883
      SIMULATOR_INTERVAL_MS: 5000
    depends_on:
      - mosquitto

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: grow-node-dashboard
    restart: unless-stopped
    command: sh -c "pnpm --filter @grow-node/contracts build && pnpm --filter @grow-node/dashboard dev"
    environment:
      CI: 'true'
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres-data:
