services:
  postgres:
    image: postgres:17-alpine
    container_name: grow-node-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: grow_node
      POSTGRES_PASSWORD: grow_node
      POSTGRES_DB: grow_node
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: grow-node-mosquitto
    restart: unless-stopped
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  postgres-data:
